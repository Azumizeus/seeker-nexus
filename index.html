:root{--violet:#9945FF;--bleu:#4C9BFF;--vert:#14F195;--or:#FFD21F;--nuit:#0A0D1E;--nuit2:#12172E;--lav:#C4A5FF;--brume:#94A3B8;--line:rgba(148,163,184,.2);--grad:linear-gradient(135deg,#9945FF,#4C9BFF 50%,#14F195)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;color-scheme:dark;scroll-padding-top:80px}
body{background:var(--nuit);color:#EEF1FF;font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
a{color:inherit;text-decoration:none}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{max-width:1160px;margin:auto;padding:0 22px;position:relative;z-index:1}
nav.top{position:fixed;top:0;left:0;right:0;z-index:50;transition:.3s}
nav.top.s{background:rgba(10,13,30,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:22px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;font-size:15px;white-space:nowrap}
.brand svg{width:34px;height:34px}
.links{display:flex;gap:4px;margin-left:auto}
.links a{color:var(--brume);padding:8px 14px;border-radius:99px;font-size:15px;transition:.2s}
.links a:hover{color:#fff;background:rgba(153,69,255,.2)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{font:inherit;font-size:13px;color:var(--brume);background:none;border:0;border-radius:99px;padding:5px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#0A0D1E;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;border-radius:99px;padding:14px 28px;cursor:pointer;border:1px solid var(--line);color:#fff;background:rgba(255,255,255,.05);transition:.25s}
.btn:hover{border-color:var(--vert);transform:translateY(-2px)}
.btn.pri{background:var(--grad);border:0;color:#06101a}
.btn.pri:hover{box-shadow:0 12px 36px rgba(153,69,255,.5)}
.hero{min-height:100vh;display:grid;align-items:center;padding:110px 0 60px;position:relative;overflow:hidden}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.g1{width:1000px;height:1000px;left:-380px;top:-380px;background:radial-gradient(closest-side,rgba(153,69,255,.3),transparent)}
.g2{width:700px;height:700px;right:-120px;bottom:0;background:radial-gradient(closest-side,rgba(20,241,149,.16),transparent)}
.hgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
.pill{display:inline-block;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--vert);border:1px solid rgba(20,241,149,.45);border-radius:99px;padding:7px 18px;margin-bottom:22px}
h1{font-size:clamp(40px,6.4vw,84px);line-height:1.02;letter-spacing:-.035em}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:#b9c1dc;font-size:clamp(17px,1.7vw,21px);max-width:54ch;margin:24px 0 32px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hmark{width:100%;max-width:470px;margin:auto;display:block;filter:drop-shadow(0 0 46px rgba(153,69,255,.45))}
.slog{margin-top:34px;display:flex;gap:18px;flex-wrap:wrap;font-weight:500;letter-spacing:.22em;font-size:13px}
.sec{padding:110px 0 10px}
.lab{color:var(--vert);letter-spacing:.18em;text-transform:uppercase;font-size:13px;margin-bottom:12px}
h2{font-size:clamp(30px,4.6vw,56px);line-height:1.06;letter-spacing:-.03em;max-width:20ch}
h2.wide{max-width:26ch}
.intro{color:var(--brume);max-width:66ch;margin-top:16px;font-size:18px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.2,.9,.3,1),transform .8s cubic-bezier(.2,.9,.3,1)}
.rv.in{opacity:1;transform:none}
.diag{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin-top:44px}
.diag svg{width:100%;max-width:460px;margin:auto;display:block;overflow:visible}
.node{cursor:pointer}.node circle.h{fill:rgba(18,23,46,.9);stroke:rgba(148,163,184,.5);stroke-width:2;transition:.25s}
.node.on circle.h,.node:hover circle.h{stroke:var(--vert);fill:rgba(20,241,149,.18)}
.node text{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle;pointer-events:none}
.dline{stroke:rgba(153,69,255,.55);stroke-width:2;stroke-dasharray:4 7;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.info{background:rgba(18,23,46,.75);border:1px solid var(--line);border-radius:24px;padding:30px;min-height:240px}
.info h3{font-size:28px;margin:12px 0 8px}.info p{color:var(--brume);font-size:17px}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--brume)}
.tag.g{color:var(--vert);border-color:rgba(20,241,149,.5)}
.hint{color:var(--brume);font-size:14px;margin-top:10px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.card{background:rgba(18,23,46,.72);border:1px solid var(--line);border-radius:22px;padding:28px;transition:.3s;position:relative;overflow:hidden}
.card:hover{border-color:rgba(153,69,255,.6);transform:translateY(-4px)}
.num{font-size:44px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.card h3{font-size:22px;margin:16px 0 8px}.card p{color:var(--brume);font-size:16px}
.how{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;margin-top:44px;align-items:start}
.tabs{display:grid;gap:10px}
.tabs button{font:inherit;text-align:left;font-weight:700;font-size:18px;color:#fff;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:16px 20px;cursor:pointer;transition:.25s;display:flex;gap:14px}
.tabs button span{color:var(--brume);font-weight:500}
.tabs button[aria-pressed=true]{background:var(--vert);color:#06101a;border-color:var(--vert)}
.tabs button[aria-pressed=true] span{color:#06101a}
.how .info h3{font-size:30px}
.pcard{display:grid;grid-template-columns:1fr 190px;gap:28px;align-items:center}.shot{margin:0;text-align:center}.shot img{width:100%;height:auto;border-radius:22px;border:1px solid rgba(148,163,184,.3);box-shadow:0 18px 50px rgba(0,0,0,.5)}.shot figcaption{font-size:12px;color:#94A3B8;margin-top:10px}
.prod{display:grid;grid-template-columns:1fr;gap:22px;margin-top:44px}.others{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:22px}.others .sc{display:flex;flex-direction:column;align-items:flex-start}.others .sc .btn{margin-top:18px}
.pcard{border:1px solid rgba(20,241,149,.4);background:linear-gradient(140deg,rgba(20,241,149,.1),rgba(153,69,255,.1));border-radius:28px;padding:34px}
.pcard h3{font-size:clamp(30px,4vw,48px);margin:14px 0 10px;letter-spacing:-.02em}
.pcard p{color:#b9c1dc;font-size:18px;max-width:50ch}
.soon{display:grid;gap:22px}
.sc{border:2px dashed var(--line);border-radius:24px;padding:26px;position:relative;overflow:hidden}
.sc h3{margin:12px 0 6px;font-size:22px}.sc p{color:var(--brume)}
@media(max-width:900px){.others{grid-template-columns:1fr}}
.ring{position:absolute;right:-26px;bottom:-26px;width:110px;height:110px;border-radius:50%;border:2px dashed var(--violet);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.5}}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.feat .card{padding:22px}.feat h3{font-size:19px;margin:10px 0 6px}.feat p{font-size:15px}.feat .num{font-size:30px}
.rule{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:center;margin-top:44px}
.donut{width:100%;max-width:340px;margin:auto;display:block}
.legend{display:grid;gap:14px;margin-top:20px}
.legend div{display:flex;align-items:center;gap:14px;font-size:20px}.legend b{font-size:28px;min-width:76px}.legend i{width:16px;height:16px;border-radius:5px}
.receipt{background:#f5f1e6;color:#1b1710;border-radius:12px;padding:26px 26px 30px;max-width:380px;margin:30px auto 0;font-family:ui-monospace,Menlo,monospace;font-size:14px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:rotate(-1.5deg);transition:.4s}
.receipt:hover{transform:rotate(0)}
.receipt h4{font-family:"Space Grotesk";font-size:19px;margin-bottom:2px}.receipt small{color:#6a6150}
.receipt hr{border:0;border-top:2px dashed #b8ae95;margin:14px 0}
.receipt .r{display:flex;justify-content:space-between;padding:3px 0}
.receipt .tg{text-align:center;margin-top:12px;font-family:"Space Grotesk";font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.ph{border:1px solid var(--line);border-top:3px solid var(--line);border-radius:18px;padding:20px;background:rgba(18,23,46,.6)}
.ph.on{border-top-color:var(--vert);border-color:rgba(20,241,149,.4)}
.ph .tag{margin-bottom:10px;display:inline-block}.ph h3{font-size:19px;margin-bottom:6px}.ph p{font-size:14.5px;color:var(--brume)}
.princ{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:44px;align-items:center}
.who p{color:#b9c1dc;font-size:18px;margin-bottom:14px}
.big{margin:110px auto 0;text-align:center;padding:70px 22px;border-radius:32px;border:1px solid rgba(153,69,255,.4);background:radial-gradient(600px 300px at 50% 0,rgba(153,69,255,.28),transparent 70%),rgba(18,23,46,.7);position:relative;z-index:1;max-width:1116px}
.big h2{margin:0 auto 26px;max-width:22ch}
footer{position:relative;z-index:1;text-align:center;padding:70px 22px 50px;color:var(--brume);font-size:14px;display:grid;gap:14px;justify-items:center}
footer .sl{font-weight:500;letter-spacing:.22em;font-size:13px}
@media(max-width:900px){.pcard{grid-template-columns:1fr}.shot{max-width:200px;margin:0 auto}.hgrid,.diag,.how,.prod,.rule,.who{grid-template-columns:1fr}.cards,.feat,.steps,.princ{grid-template-columns:1fr}.road{grid-template-columns:1fr}.links{display:none}.hmark{max-width:260px;order:-1}.lang{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head>
